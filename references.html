<!doctype html><html><head><title>Local video reference review</title><style>body{background:#222;color:white;font:14px sans-serif}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}video{width:100%;height:260px;background:black}p{margin:4px}</style></head><body><h1>Subway movement references</h1><div class="grid" id="grid"></div><script>for(let i=0;i<6;i++){const d=document.createElement('div');d.innerHTML=`<video src="/reference-video/${i}" controls muted preload="auto"></video><p>Reference ${i+1} <span></span></p>`;const v=d.querySelector('video');v.addEventListener('loadedmetadata',()=>{d.querySelector('span').textContent=`${v.duration.toFixed(1)}s · ${v.videoWidth}×${v.videoHeight}`;v.currentTime=Math.min(v.duration*.3,12)});v.addEventListener('error',()=>d.querySelector('span').textContent='Playback error: '+v.error?.message);document.getElementById('grid').append(d)}</script></body></html>
